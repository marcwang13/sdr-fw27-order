<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SDR FW27 線上訂貨</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky order header + filter rail, product rows as wide cards with an inline size grid, fixed tally bar at the bottom */
:root{
  --bg:#f4f2f1; --surface:#ffffff; --sunk:#ece8e6; --line:#ddd6d3; --fg:#1c1515; --muted:#6f6464;
  --red:#7d1518; --red-ink:#ffffff; --red-soft:#f4e3e2; --ok:#1f7a4d; --ok-soft:#e3f2ea; --warn:#9a6200;
  --brand:#610e0e; --brand-ink:#ffffff; --brand-2:#4a0a0b;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120d0d; --surface:#1c1515; --sunk:#271e1e; --line:#3a2d2d; --fg:#f0eaea; --muted:#a89a9a;
  --red:#d2484f; --red-ink:#ffffff; --red-soft:#3d1a1c; --ok:#4cc38a; --ok-soft:#173326; --warn:#e0a640;
  --brand:#5a0d0e; --brand-ink:#ffffff; --brand-2:#3f090a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120d0d; --surface:#1c1515; --sunk:#271e1e; --line:#3a2d2d; --fg:#f0eaea; --muted:#a89a9a;
  --red:#d2484f; --red-ink:#ffffff; --red-soft:#3d1a1c; --ok:#4cc38a; --ok-soft:#173326; --warn:#e0a640;
  --brand:#5a0d0e; --brand-ink:#ffffff; --brand-2:#3f090a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* masthead */
.mast{background:var(--brand);color:var(--brand-ink)}
.mast .wrap{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:26px;letter-spacing:.1em;color:var(--brand-ink);line-height:1}
.brand span{font-family:var(--f-disp);font-weight:600;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.brand em{font-style:normal;color:color-mix(in srgb,var(--brand-ink) 70%,transparent);font-size:13px}
.views{margin-left:auto;display:flex;gap:4px;background:var(--brand-2);padding:3px;border-radius:999px}
.views button{border:1.5px solid transparent;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;color:color-mix(in srgb,var(--brand-ink) 75%,transparent)}
.views button[aria-pressed="true"]{background:#fff;color:#610e0e;font-weight:600}
.views button:not([aria-pressed="true"]){border-color:rgb(255 255 255 / .45)}
.views button:not([aria-pressed="true"]):hover{border-color:#fff;color:#fff}

/* dealer form */
.dealer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding-block:16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.fld input,.fld textarea,.fld select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0;width:100%}
.fld.wide{grid-column:1/-1}
.fld textarea{resize:vertical;min-height:38px}
.req{color:var(--red)}
.chaintg{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding-bottom:10px;cursor:pointer;width:fit-content}
.chaintg input{accent-color:var(--red);width:16px;height:16px}
.chaintg small{font-weight:400;color:var(--muted)}
.brbar{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.brbar::-webkit-scrollbar{display:none}
.br.info{border-style:solid;border-color:var(--line);cursor:default}
.mx-wrap{overflow-x:auto;max-width:100%}
.mx{border-collapse:collapse;font-size:12px;margin-left:auto}
.mx th,.mx td{padding:2px 3px;border:0;text-align:center;vertical-align:middle;background:none}
.mx thead th{font-family:var(--f-disp);font-weight:600;color:var(--muted);letter-spacing:.04em}
.mx thead th>span:first-child{display:block}
.mx thead th .pct{margin:2px auto 0;position:relative;display:block;width:46px;height:15px;border-radius:3px;background:var(--sunk);overflow:hidden;font-family:var(--f-mono);font-size:10px;line-height:15px;color:var(--fg);letter-spacing:0}
.mx .pct i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--red) 28%,transparent)}
.mx .pct b{position:relative;font-weight:500}
.mx .pct.na{color:var(--muted)}
.mx .bn{text-align:right;font-weight:600;color:var(--fg);max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;font-family:var(--f-body)}
.mx td input{width:46px;height:32px;text-align:center;border:1.5px solid color-mix(in srgb,var(--red) 35%,var(--line));border-radius:4px;background:var(--bg);font-family:var(--f-mono);font-size:13px;-moz-appearance:textfield}
.mx td input::-webkit-outer-spin-button,.mx td input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mx td input.on{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:600}
.mx .bt,.mx tfoot td{font-family:var(--f-mono);font-weight:500;min-width:34px}
.mx tfoot th,.mx tfoot td{border-top:1px solid var(--line);padding-top:4px}
.brbar .lab{font-size:12px;color:var(--muted);flex:none}
.br{flex:none;border:1.5px dashed color-mix(in srgb,var(--red) 50%,var(--line));background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.br small{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.br[aria-pressed="true"]{border-style:solid;border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:600}
.br.add,.br.mng{border-style:solid;color:var(--red)}
.offbar{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--red-soft);border:1.5px solid color-mix(in srgb,var(--red) 40%,transparent);font-size:13px;line-height:1.6}
.offbar b{color:var(--red);flex:none}
.acct{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);font-size:13px;line-height:1.6}
.acct.need{border-color:color-mix(in srgb,var(--red) 55%,transparent);background:var(--red-soft)}
.acct b{color:var(--red)}
.acct .t{flex:1;min-width:220px}
.acct input{height:34px;padding:0 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.acct input.em{width:240px;max-width:100%}
.acct input.cd{width:110px;letter-spacing:4px;text-align:center}
.acct .am{flex-basis:100%;font-size:12px;color:var(--muted)}
.acct .am.err{color:var(--red)}
.offbar span{flex:1;min-width:220px}
.xlbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:14px;font-size:13px;color:var(--muted)}
.xlhint{font-size:12px}

/* filter rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid color-mix(in srgb,var(--red) 45%,var(--line));background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;display:flex;gap:6px;align-items:center;transition:border-color .15s,background .15s}
.tab:hover{border-color:var(--red)}
.tab small{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tab[aria-pressed="true"] small{color:inherit;opacity:.7}
.tab .dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:var(--red-ink);font-size:11px;font-family:var(--f-mono);display:inline-grid;place-items:center}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1.5px solid color-mix(in srgb,var(--red) 40%,var(--line));background:var(--surface);border-radius:4px;padding:3px 9px;font-size:12px;font-family:var(--f-disp);font-weight:600;letter-spacing:.06em}
.chip:hover{border-color:var(--red)}
.chip[aria-pressed="true"]{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.search{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg);white-space:nowrap;border:1.5px solid color-mix(in srgb,var(--red) 40%,var(--line));border-radius:var(--r);padding:5px 10px;background:var(--surface);cursor:pointer}
.toggle input{accent-color:var(--red)}

/* groups + product rows */
main{padding-block:12px}
.group{margin-top:22px}
.ghead{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.ghead h2{margin:0;font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.ghead span{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:14px;padding:10px;position:relative}
.item.has{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.pic{position:relative;width:132px;aspect-ratio:1;max-width:100%;background:#fff;border-radius:6px;overflow:hidden;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--red) 40%,var(--line));transition:border-color .15s,box-shadow .15s}
.pic:hover{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px;cursor:zoom-in}
.pic .none{color:#9a9aa2;font-size:12px}
.pic .sw{position:absolute;left:4px;bottom:4px;display:flex;gap:2px}
.pic .sw{left:4px;right:4px;bottom:4px;gap:3px}
.pic .sw button{flex:1;border:1.5px solid #610e0e;font-size:11px;padding:2px 4px;border-radius:4px;background:#fff;color:#610e0e;font-weight:600;cursor:zoom-in}
.pic .sw button:hover{background:#610e0e;color:#fff}
.pic .sw button[aria-pressed="true"]{background:var(--red)}
.info{min-width:0;display:flex;flex-direction:column;gap:4px}
.t1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.t1 h3{margin:0;font-size:15px;font-weight:700}
.en{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.04em;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.tag{background:var(--sunk);border-radius:3px;padding:1px 7px}
.tag.c{font-family:var(--f-disp);font-weight:700;letter-spacing:.06em;font-size:13px}
.tag.m{background:var(--red-soft);color:var(--red);font-weight:600}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ov{font-size:13px;color:var(--muted);margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{font-size:12px;color:var(--warn)}
.more{align-self:flex-start;border:1.5px solid color-mix(in srgb,var(--red) 55%,var(--line));background:var(--surface);color:var(--red);font-size:12px;padding:2px 10px;border-radius:999px;margin-top:2px}
.more:hover{border-color:var(--red);background:var(--red-soft)}
.detail{font-size:13px;line-height:1.65;display:grid;gap:8px;margin-top:4px;padding:10px;background:var(--sunk);border-radius:4px}
.detail h4{margin:0 0 2px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.detail p{margin:0;white-space:pre-line}
.order{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0}
.price{font-family:var(--f-mono);font-size:15px;font-weight:500}
.price small{font-family:var(--f-body);font-size:11px;color:var(--muted);margin-right:4px}
.sizes{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
.sz{display:flex;flex-direction:column;align-items:center;gap:2px}
.sz span{font-family:var(--f-disp);font-weight:600;font-size:12px;letter-spacing:.04em;color:var(--muted)}
.sz input{width:48px;height:36px;text-align:center;border:1.5px solid color-mix(in srgb,var(--red) 35%,var(--line));border-radius:4px;background:var(--bg);font-family:var(--f-mono);font-size:14px;-moz-appearance:textfield}
.sz input::-webkit-outer-spin-button,.sz input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sz input.on{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:600}
.sz .pct{position:relative;width:48px;height:16px;border-radius:3px;background:var(--sunk);overflow:hidden;font-family:var(--f-mono);font-size:10px;line-height:16px;text-align:center;color:var(--fg)}
.sz .pct i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--red) 28%,transparent)}
.sz .pct b{position:relative;font-weight:500}
.sz .pct.na{color:var(--muted)}
.share{font-size:11px;color:var(--muted);text-align:right}
.share b{color:var(--fg);font-weight:500}
.sub{font-size:12px;color:var(--muted)}
.sub b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

/* tally bar */
.tally{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--brand);color:var(--brand-ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.tally .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat small{font-size:11px;opacity:.65;letter-spacing:.06em}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:18px}
.tally .act{margin-left:auto;display:flex;gap:8px}
.btn{border:1.5px solid color-mix(in srgb,var(--red) 45%,var(--line));background:var(--surface);color:var(--fg);border-radius:var(--r);padding:9px 16px;font-weight:600;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--red)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.tally .btn.pri{background:#fff;border-color:#fff;color:#610e0e}
.tally .btn.ghost{border-color:rgb(255 255 255 / .6)}
.tally .btn.ghost:hover{border-color:#fff}
.btn.ghost{background:transparent;color:inherit;border-color:color-mix(in srgb,currentColor 35%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}

/* sheet / dialogs */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:40;display:flex;justify-content:flex-end}
.panel{background:var(--bg);width:min(720px,100%);height:100%;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:14px}
.panel>*{flex:none}
.panel h2{margin:0;font-family:var(--f-disp);font-size:24px;letter-spacing:.05em;text-transform:uppercase}
.phead{display:flex;align-items:center;gap:10px}
.phead .x{margin-left:auto}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--sunk);white-space:nowrap}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--sunk)}
.msg{padding:10px 12px;border-radius:var(--r);font-size:13px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.err{background:var(--red-soft);color:var(--red)}
.msg.info{background:var(--sunk);color:var(--muted)}
.zm-scrim{position:fixed;inset:0;z-index:50;background:rgb(0 0 0 / .45);display:grid;place-items:center;padding:16px}
.zm{position:relative;background:#fff;border-radius:10px;box-shadow:0 20px 60px rgb(0 0 0 / .35);display:flex;flex-direction:column;overflow:hidden;animation:zmIn .22s cubic-bezier(.2,.8,.2,1)}
.zm.doll{width:min(90vw,500px);height:min(76vh,620px)}
.zm.photo{width:min(92vw,720px);height:min(84vh,860px)}
@keyframes zmIn{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
.zm-img{flex:1;min-height:0;position:relative}
.zm-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:14px}
.zm-img .none{position:absolute;inset:0;display:grid;place-items:center;color:#888}
.zm-x{position:absolute;top:8px;right:8px;z-index:2;border:0;width:32px;height:32px;border-radius:50%;background:rgb(0 0 0 / .55);color:#fff;font-size:18px;line-height:1}
.zm-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #e6e6e6;color:#222;font-size:12px}
.zm-bar .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.zm-tabs{display:flex;gap:2px;background:#eee;border-radius:999px;padding:2px}
.zm-tabs button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:12px;color:#555}
.zm-tabs button[aria-pressed="true"]{background:#610e0e;color:#fff}
.zm-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;border:0;background:rgb(0 0 0 / .45);color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px}
.zm-arrow.l{left:8px}.zm-arrow.r{right:8px}
.zm-count{font-family:var(--f-mono);color:#777}
@media (prefers-reduced-motion:reduce){.zm{animation:none}}

/* orders (mine + admin) */
.cards{display:grid;gap:10px}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.oc h3{margin:0;font-size:15px}
.oc .sub{grid-column:1}
.oc .acts{grid-row:1/3;grid-column:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.aebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;padding:10px 14px;border:1.5px solid var(--brand);border-radius:8px;background:color-mix(in srgb,var(--brand) 8%,transparent)}
.aebar b{color:var(--brand)}
.aebar span{flex:1;min-width:220px;font-size:13px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:4px 0}
.chk input{margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi small{color:var(--muted);font-size:12px}
.kpi b{display:block;font-family:var(--f-mono);font-weight:500;font-size:20px}
.section-title{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin:18px 0 8px}

.ov-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ov-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ov-card h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em}
.ov-top{display:flex;gap:14px;align-items:center}
.ov-top svg{flex:none;width:132px;height:132px}
.ov-leg{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:12px}
.ov-leg div{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:6px;align-items:center}
.ov-leg i{width:10px;height:10px;border-radius:2px}
.ov-leg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-leg b{font-family:var(--f-mono);font-weight:500;text-align:right}
.ov-leg em{font-style:normal;font-family:var(--f-mono);color:var(--muted);min-width:44px;text-align:right}
.ov-c1{font-family:var(--f-mono);font-size:15px;fill:var(--fg)}
.ov-c2{font-size:9px;fill:var(--muted)}
.ov{display:flex;flex-direction:column;gap:10px}
.ov-sec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.ov-g{font-weight:400;letter-spacing:0}
.ov-empty{color:var(--muted);font-size:13px;padding:8px 0}
@media (max-width:760px){.ov-wrap{grid-template-columns:1fr}}
.panel .ov-wrap{grid-template-columns:1fr}
.panel .ov-top svg{width:150px;height:150px}
@media (max-width:760px){
  .dealer{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item{grid-template-columns:96px minmax(0,1fr)}
  .pic{width:96px}
  .order{grid-column:1/-1;align-items:stretch}
  .sizes{justify-content:flex-start;max-width:none}
  .ordtop{display:flex;justify-content:space-between;align-items:baseline}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tally .wrap{gap:14px}
  .tally .act{margin-left:0;width:100%}
  .tally .act .btn{flex:1}
}
@media (min-width:761px){.ordtop{display:flex;flex-direction:column;align-items:flex-end;gap:2px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>


<header class="mast">
  <div class="wrap">
    <div class="brand"><b>SUN DAY RED</b><span>FW27 Order</span><em>台灣經銷線上訂貨</em></div>
    <nav class="views" aria-label="檢視">
      <button id="v-order" aria-pressed="true">下單</button>
      <button id="v-mine" aria-pressed="false">我的訂單</button>
      <button id="v-admin" aria-pressed="false" hidden>訂單彙整</button>
    </nav>
  </div>
</header>

<section id="view-order">
  <div class="wrap">
    <div class="offbar" id="offbar" hidden><b>傳單下單</b><span>照常挑款、填數量，完成後按右下角「檢視並下載」。能下載就會存成 Excel 訂單本；不能下載時會改成「複製」，貼到 Excel 或 LINE 傳給 SDR 業務即可。</span></div>
    <div class="aebar" id="aebar" hidden><b>業務編輯中</b><span id="ae-txt"></span><button class="btn sm" id="ae-cancel">取消編輯</button></div>
    <div class="acct" id="acct" hidden></div>
    <div class="dealer">
      <div class="fld"><label for="d-store">經銷商／店名 <span class="req">*</span></label><input id="d-store" autocomplete="organization"></div>
      <div class="fld"><label for="d-contact">聯絡人 <span class="req">*</span></label><input id="d-contact" autocomplete="name"></div>
      <div class="fld"><label for="d-phone">電話</label><input id="d-phone" inputmode="tel" autocomplete="tel"></div>
      <div class="fld"><label for="d-email">Email</label><input id="d-email" inputmode="email" autocomplete="email"></div>
      <div class="fld wide"><label for="d-note">訂單備註</label><textarea id="d-note" rows="1" placeholder="例如：分批出貨、指定門市"></textarea></div>
    </div>
    <label class="chaintg"><input type="checkbox" id="chain"> 連鎖分店下單 <small>各店分開填數量，送出時合併成一張單</small></label>
    <div class="xlbar">
      <span>習慣用 Excel？</span>
      <button class="btn sm" id="x-export">下載 Excel 訂單本</button>
      <button class="btn sm" id="x-import">匯入 Excel 訂單本</button>
      <input type="file" id="x-file" accept=".xlsx" hidden>
      <span class="xlhint" id="x-msg"></span>
    </div>
  </div>
  <div class="rail">
    <div class="wrap">
      <div class="brbar" id="brbar" hidden></div>
      <div class="tabs" id="tabs" role="toolbar" aria-label="分頁"></div>
      <div class="row2">
        <div class="chips" id="months" aria-label="月份"></div>
        <input class="search" id="q" type="search" placeholder="搜尋品名、款號、色碼、顏色">
        <label class="toggle"><input type="checkbox" id="only"> 只看已下單</label>
      </div>
    </div>
  </div>
  <main class="wrap" id="list"></main>
</section>

<section id="view-mine" hidden><div class="wrap" id="mine" style="padding-block:18px"></div></section>
<section id="view-admin" hidden><div class="wrap" id="admin" style="padding-block:18px"></div></section>

<div class="tally" id="tally">
  <div class="wrap">
    <div class="stat"><small>款色</small><b class="num" id="t-sty">0</b></div>
    <div class="stat"><small id="t-qtyl">件數</small><b class="num" id="t-qty">0</b></div>
    <div class="stat"><small>零售金額 TWD</small><b class="num" id="t-amt">0</b></div>
    <div class="stat" id="t-br" hidden><small id="t-brn">本店</small><b class="num" id="t-brq">0</b></div>
    <div class="stat" id="t-edit" hidden><small>編輯中</small><b class="num" id="t-eid" style="font-size:13px"></b></div>
    <div class="act">
      <button class="btn ghost" id="b-ov">下單總覽</button>
      <button class="btn ghost" id="b-clear">清空</button>
      <button class="btn pri" id="b-review">檢視並送出</button>
    </div>
  </div>
</div>

<div id="overlay"></div>

<script src="config.js"></script>
<script>
/* GitHub Pages 版：以本機模擬原本 Claude 頁面的能力；送單改送到 Google Apps Script */
(function(){
  const CFG=window.SDR_CONFIG||{}; const URL_=(CFG.SUBMIT_URL||'').trim();
  const HKEY='sdr-fw27-sent-v1';
  let ADMIN=''; try{ const q=new URLSearchParams(location.search); if(q.has('admin')){ const v=q.get('admin'); if(v&&v!=='off') localStorage.setItem('sdr-admin',v); else localStorage.removeItem('sdr-admin'); q.delete('admin'); history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash); } ADMIN=localStorage.getItem('sdr-admin')||''; }catch(e){}
  let ACACHE={};
  function toPageOrder(o){ const IT=window.SDR_ITEMS||[]; const key=l=>{ const it=IT.find(i=>i.sku===l.sku&&i.sheet===l.sheet)||IT.find(i=>i.sku===l.sku); return it?it.id:('x:'+l.sku+'|'+l.color); };
    const agg={}; const br={}; const brOrder=[];
    for(const l of o.lines||[]){ const k=key(l); const a=agg[k+'|'+l.size]=agg[k+'|'+l.size]||{k,sheet:l.sheet,mon:l.mon,style:l.style,sku:l.sku,en:l.en,zh:l.zh,color:l.color,size:l.size,qty:0,price:l.price}; a.qty+=l.qty;
      if(l.branch){ if(!br[l.branch]){ br[l.branch]=[]; brOrder.push(l.branch); } br[l.branch].push({k,size:l.size,qty:l.qty}); } }
    return {...o,uid:o.oid,lines:Object.values(agg),branches:brOrder.map(n=>({name:n,lines:br[n]}))}; }
  async function adminList(){ const r=await fetch(URL_+(URL_.includes('?')?'&':'?')+'action=list&key='+encodeURIComponent(ADMIN)+'&t='+Date.now()); const j=await r.json(); if(j.error){ const err=new Error(j.error==='forbidden'?'管理金鑰不正確':j.error); err.code=j.error; throw err; } ACACHE={}; (j.orders||[]).forEach(o=>{ ACACHE[o.oid]=toPageOrder(o); }); return Object.values(ACACHE); }
  let dev=null; try{ dev=localStorage.getItem('sdr-dev'); if(!dev){ dev='d'+Math.random().toString(36).slice(2,10); localStorage.setItem('sdr-dev',dev); } }catch(e){ dev='d'+Math.random().toString(36).slice(2,10); }
  const hist=()=>{ try{ return JSON.parse(localStorage.getItem(HKEY)||'[]'); }catch(e){ return []; } };
  const AKEY='sdr-auth'; let SRV=[];
  const auth=()=>{ try{ const a=JSON.parse(localStorage.getItem(AKEY)||'null'); return a&&a.email&&a.token?a:null; }catch(e){ return null; } };
  const subs=[]; const emit=()=>{ const ids=new Set(SRV.map(o=>o.oid)); const docs=[...SRV,...hist().filter(o=>!ids.has(o.oid))].sort((a,b)=>String(b.submittedAt).localeCompare(String(a.submittedAt))).map(d=>({id:d.oid,exists:true,data:()=>d})); subs.forEach(f=>f({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}})); };
  async function post(body){ const opt={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)};
    try{ const r=await fetch(URL_,{...opt,redirect:'follow'}); return (await r.text()).trim(); }
    catch(e){ await fetch(URL_,{...opt,mode:'no-cors'}); return 'ok'; } }
  async function refreshMine(){ const a=auth(); if(!a||!URL_){ SRV=[]; emit(); return; } try{ const t=await post({action:'mine',auth:a}); const j=JSON.parse(t); if(j.error==='login_required'){ try{ localStorage.removeItem(AKEY); }catch(e){} SRV=[]; } else SRV=(j.orders||[]).map(toPageOrder); }catch(e){} emit(); }
  window.SDR_AUTH={ get:auth,
    async sendCode(email){ return await post({action:'otp_send',email}); },
    async verify(email,code){ const t=await post({action:'otp_verify',email,code}); let j; try{ j=JSON.parse(t); }catch(e){ j={error:t}; } if(j.token){ try{ localStorage.setItem(AKEY,JSON.stringify({email:j.email,token:j.token})); }catch(e){} refreshMine(); } return j; },
    logout(){ try{ localStorage.removeItem(AKEY); }catch(e){} SRV=[]; emit(); } };
  const KNOWN=['login_required','forbidden'];
  window.SDR_ADMIN={ on:!!ADMIN,
    async save(body){ const res=await post({...body,action:'admin_save',key:ADMIN}); delete body._xlsx; delete body._xlsxName;
      if(res==='ok'||/<html/i.test(res)) return; const err=new Error(res==='forbidden'?'管理金鑰不正確':res==='deleted'?'這張訂單已不在試算表（客人可能已刪除）':res==='void'?'這張訂單已作廢':res); err.code=res; throw err; } };
  const db={ doc(path){ const p=path.split('/'); return { async set(body){ if(p.length===4&&p[2]==='subs'){ const res=await post({...body,auth:auth()}); delete body._xlsx; delete body._xlsxName; if(KNOWN.includes(res)){ const err=new Error(res); err.code=res; throw err; } if(res==='deleted'||res==='void'){ try{ localStorage.setItem(HKEY,JSON.stringify(hist().filter(x=>x.oid!==body.oid))); }catch(e){} emit(); const err=new Error('order_closed'); err.code='order_closed'; throw err; } if(res&&res!=='ok'&&!/<html/i.test(res)) { const err=new Error(res); err.code='server'; throw err; } const h=hist().filter(x=>x.oid!==body.oid); h.push(body); try{ localStorage.setItem(HKEY,JSON.stringify(h)); }catch(e){} SRV=SRV.filter(x=>x.oid!==body.oid); emit(); refreshMine(); } }, async update(body){ if(p.length===4&&p[2]==='subs'&&ADMIN&&body&&body.status){ const res=await post({action:'status',oid:p[3],status:body.status,key:ADMIN}); if(res!=='ok'){ const err=new Error(res==='forbidden'?'管理金鑰不正確':res==='deleted'?'這張訂單已不在試算表':res); err.code=res; throw err; } if(ACACHE[p[3]]) ACACHE[p[3]].status=body.status; } }, async delete(){ if(p.length===4&&p[2]==='subs'){ const res=await post({action:'cancel',oid:p[3],auth:auth()}); if(KNOWN.includes(res)){ const err=new Error(res); err.code=res; throw err; } if(res&&res!=='ok'&&res!=='deleted'&&res!=='void'&&!/<html/i.test(res)){ const err=new Error(res); err.code='server'; throw err; } try{ localStorage.setItem(HKEY,JSON.stringify(hist().filter(x=>x.oid!==p[3]))); }catch(e){} SRV=SRV.filter(x=>x.oid!==p[3]); emit(); } }, async get(){ return {exists:false,data:()=>undefined}; } }; },
    collection(path){ const parts=String(path||'').split('/');
      if(path==='orders'){ const q={ orderBy(){ return q; }, limit(){ return q; }, where(){ return q; },
          onSnapshot(next,fail){ let stop=false; const run=async()=>{ try{ const os=await adminList(); if(!stop) next({docs:os.map(o=>({id:o.oid,exists:true,data:()=>({uid:o.oid,store:o.store,contact:o.contact,updatedAt:o.submittedAt})})),size:os.length,empty:!os.length,docChanges:()=>[]}); }catch(e){ if(!stop&&fail) fail(e); } }; run(); const t=setInterval(run,60000); return ()=>{ stop=true; clearInterval(t); }; },
          async get(){ const os=await adminList(); return {docs:os.map(o=>({id:o.oid,data:()=>o}))}; } }; return q; }
      if(parts.length===3&&parts[2]==='subs'&&ACACHE[parts[1]]){ const o=ACACHE[parts[1]]; const q={ orderBy(){ return q; }, limit(){ return q; }, where(){ return q; }, onSnapshot(next){ next({docs:[{id:o.oid,data:()=>o}]}); return ()=>{}; }, async get(){ return {docs:[{id:o.oid,data:()=>o}]}; } }; return q; }
      const q={ orderBy(){ return q; }, limit(){ return q; }, where(){ return q; }, onSnapshot(next){ subs.push(next); setTimeout(emit,0); refreshMine(); return ()=>{ const i=subs.indexOf(next); if(i>=0) subs.splice(i,1); }; }, async get(){ return {docs:[]}; } }; return q; } };
  const downloads={ async save({filename,data}){ const blob=data instanceof Blob?data:new Blob([data]); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },3000); return {status:'saved'}; } };
  const user={ id:async()=>dev, canEdit:async()=>!!(ADMIN&&URL_), isOwner:async()=>false, can:async()=>!!URL_ };
  window.claude={ use:async n=> n==='downloads'?downloads : n==='user'?user : n==='db'?(URL_?db:null) : null };
})();
</script>
<script src="data.js"></script>
<script src="imgs.js"></script>
<script>
(function(){
const ITEMS = window.SDR_ITEMS || [];
const IMG = window.SDR_IMG || {};
const BY = Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const SHEETS = ['服裝-男','服裝-女','配件','球袋','鞋款'];
const MONTH_ORDER = ['CORE','2月','7月','8月','9月','10月','11月'];
const $ = s=>document.querySelector(s);
const fmt = n=>Math.round(n||0).toLocaleString('en-US');
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- state ----------
const DRAFT_KEY='sdr-fw27-draft-v1';
let S = {sheet:'服裝-男', months:new Set(), q:'', only:false, qty:{}, dealer:{store:'',contact:'',phone:'',email:'',note:''}, editing:null, admin:null, open:new Set(), pic:{}, chain:false, br:[], bq:{}, cur:null};
try{ const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); if(d){ S.qty=d.qty||{}; S.dealer=Object.assign(S.dealer,d.dealer||{}); S.editing=d.editing||null; S.admin=d.admin||null; if(d.chain&&Array.isArray(d.br)&&d.br.length){ S.chain=true; S.br=d.br; S.bq=d.bq||{}; S.cur=S.br.some(b=>b.id===d.cur)?d.cur:S.br[0].id; } } }catch(e){}
let saveT=null;
function adminEditing(){ return !!(S.admin&&S.editing&&S.admin.oid===S.editing&&window.SDR_ADMIN?.on); }
function saveDraft(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(DRAFT_KEY,JSON.stringify({qty:S.qty,dealer:S.dealer,editing:S.editing,admin:S.admin,chain:S.chain,br:S.br,bq:S.bq,cur:S.cur})); }catch(e){} },300); }

// ---- chain stores ----
function sumQ(m){ let t=0; for(const id in m||{}) for(const z in m[id]) t+=m[id][z]||0; return t; }
function recalcAgg(){ if(!S.chain) return; const a={}; for(const b of S.br){ const m=S.bq[b.id]||{}; for(const id in m) for(const z in m[id]){ const v=m[id][z]; if(v>0){ a[id]=a[id]||{}; a[id][z]=(a[id][z]||0)+v; } } } S.qty=a; }
function curQ(){ return S.chain?(S.bq[S.cur]=S.bq[S.cur]||{}):S.qty; }
function brId(){ return 'b'+Math.random().toString(36).slice(2,8); }
function brStats(b){ const m=S.bq[b.id]||{}; let sty=0,qty=0,amt=0; for(const id in m){ let q=0; for(const z in m[id]) q+=m[id][z]||0; if(q){ sty++; qty+=q; amt+=q*((BY[id]&&BY[id].price)||0); } } return {sty,qty,amt}; }
function branchTableHTML(){ if(!S.chain||!S.br.length) return ''; const rows=S.br.map(b=>{ const t=brStats(b); return `<tr><td>${esc(b.name)}</td><td class="r num">${t.sty}</td><td class="r num">${fmt(t.qty)}</td><td class="r num">${fmt(t.amt)}</td></tr>`; }).join(''); const T=totals(); return `<div class="tbl"><table><thead><tr><th>分店</th><th class="r">款色</th><th class="r">件數</th><th class="r">零售金額</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>合計</td><td class="r num">${T.sty}</td><td class="r num">${fmt(T.qty)}</td><td class="r num">${fmt(T.amt)}</td></tr></tfoot></table></div>`; }
function branchesForExport(){ return (S.chain&&S.br.length)?S.br.map(b=>({name:b.name,qty:S.bq[b.id]||{}})):null; }
function branchesFromOrder(o){ return (o.branches&&o.branches.length)?o.branches.map(b=>({name:b.name,qty:qtyFromLines(b.lines)})):null; }
function itemQty(id){ const m=S.qty[id]; if(!m) return 0; let t=0; for(const k in m) t+=m[k]||0; return t; }
function totals(){ let sty=0,qty=0,amt=0; const bySheet={}; for(const id in S.qty){ const q=itemQty(id); if(!q) continue; const it=BY[id]; if(!it) continue; sty++; qty+=q; amt+=q*(it.price||0); bySheet[it.sheet]=(bySheet[it.sheet]||0)+q; } return {sty,qty,amt,bySheet}; }

// ---------- dealer fields ----------
['store','contact','phone','email','note'].forEach(k=>{ const el=$('#d-'+k); el.value=S.dealer[k]||''; el.addEventListener('input',()=>{ S.dealer[k]=el.value; saveDraft(); }); });

// ---------- tabs & filters ----------
function renderTabs(){
  const t=totals();
  $('#tabs').innerHTML = SHEETS.map(s=>{ const n=ITEMS.filter(i=>i.sheet===s).length; const d=t.bySheet[s]; return `<button class="tab" data-s="${s}" aria-pressed="${S.sheet===s}">${s}<small>${n}</small>${d?`<span class="dot">${d}</span>`:''}</button>`; }).join('');
  const ms = MONTH_ORDER.filter(m=>ITEMS.some(i=>i.sheet===S.sheet && i.mon===m));
  $('#months').innerHTML = `<button class="chip" data-m="" aria-pressed="${S.months.size===0}">全部</button>` + ms.map(m=>`<button class="chip" data-m="${m}" aria-pressed="${S.months.has(m)}">${m}</button>`).join('');
}
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-s]'); if(!b) return; S.sheet=b.dataset.s; S.months.clear(); renderTabs(); renderList(); window.scrollTo({top:$('.rail').offsetTop-1}); });
$('#months').addEventListener('click',e=>{ const b=e.target.closest('[data-m]'); if(!b) return; const m=b.dataset.m; if(!m) S.months.clear(); else S.months.has(m)?S.months.delete(m):S.months.add(m); renderTabs(); renderList(); });
let qT=null; $('#q').addEventListener('input',e=>{ clearTimeout(qT); qT=setTimeout(()=>{ S.q=e.target.value.trim().toLowerCase(); renderList(); },150); });
$('#only').addEventListener('change',e=>{ S.only=e.target.checked; renderList(); });

// ---------- product list ----------
function picHTML(it){
  const ph=it.photos||[];
  const h = it.doll||ph[0];
  const src = h && IMG[h];
  const sw = (it.doll || ph.length) ? `<div class="sw">${it.doll?'<button data-pic="doll">娃娃圖</button>':''}${ph.length?`<button data-pic="photo">實體圖${ph.length>1?' '+ph.length:''}</button>`:''}</div>` : '';
  return src ? `<img src="${src}" alt="${esc(it.en+' '+it.color)}" data-zoom loading="lazy">${sw}` : `<span class="none">圖片待補</span>`;
}
const big = h=>`big/${h}.jpg`;
let LB=null;
function openLB(id,kind,ev){ const it=BY[id]; const ph=it.photos||[]; if(kind==='photo'&&!ph.length) kind='doll'; if(kind==='doll'&&!it.doll) kind='photo'; LB={id,kind,i:0,ox:ev?ev.clientX:null,oy:ev?ev.clientY:null}; renderLB(true); }
function renderLB(anim){
  const it=BY[LB.id]; const ph=it.photos||[]; const isP=LB.kind==='photo';
  const h=isP?ph[LB.i]:it.doll;
  const img=h?`<img src="${big(h)}" alt="${esc(it.en+' '+it.color)}" onerror="this.onerror=null;this.src='${IMG[h]||''}'">`:'<span class="none">尚無圖片</span>';

function orderDetailHTML(o){
  const SZ=['XXS','XS','S','M','L','XL','2XL','XXL','3XL','FREE SIZE'];
  const rank=z=>{ const i=SZ.indexOf(String(z).toUpperCase()); if(i>=0) return [0,i]; const n=parseFloat(z); return isNaN(n)?[2,0]:[1,n]; };
  const blocks=(o.branches&&o.branches.length)?o.branches.map(b=>({name:b.name,lines:(b.lines||[]).map(x=>{ const it=BY[x.k]||{}; return {...x,sheet:it.sheet,style:it.style,sku:it.sku,zh:it.zh||it.en,color:it.color,price:it.price||0}; })})):[{name:'',lines:o.lines||[]}];
  return blocks.map(bk=>{
    const g={}, ord=[], sizes=[];
    for(const l of bk.lines){ const key=l.k||(l.sku+'|'+l.color); if(!g[key]){ g[key]={l,q:{},qty:0}; ord.push(key); } g[key].q[l.size]=(g[key].q[l.size]||0)+l.qty; g[key].qty+=l.qty; if(!sizes.includes(l.size)) sizes.push(l.size); }
    sizes.sort((a,b)=>{ const x=rank(a),y=rank(b); return x[0]-y[0]||x[1]-y[1]; });
    ord.sort((a,b)=>SHEETS.indexOf(g[a].l.sheet)-SHEETS.indexOf(g[b].l.sheet));
    const tq=ord.reduce((t,k)=>t+g[k].qty,0), ta=ord.reduce((t,k)=>t+g[k].qty*(g[k].l.price||0),0);
    return `${bk.name?`<div style="font-weight:700;margin:12px 0 6px">分店：${esc(bk.name)}</div>`:''}<div class="tbl" style="margin-top:10px"><table><thead><tr><th>分頁</th><th>品名</th><th>顏色</th>${sizes.map(z=>`<th class="r">${esc(z)}</th>`).join('')}<th class="r">件數</th><th class="r">零售金額</th></tr></thead><tbody>${ord.map(k=>{ const x=g[k], l=x.l; return `<tr><td>${esc(l.sheet)}</td><td>${esc(l.zh||l.en)}<div class="code">${esc(l.style)} ／ ${esc(l.sku)}</div></td><td>${esc(l.color)}</td>${sizes.map(z=>`<td class="r num">${x.q[z]||''}</td>`).join('')}<td class="r num"><b>${x.qty}</b></td><td class="r num">${fmt(x.qty*(l.price||0))}</td></tr>`; }).join('')}<tr><td colspan="3"><b>合計</b></td>${sizes.map(z=>`<td class="r num">${ord.reduce((t,k)=>t+(g[k].q[z]||0),0)||''}</td>`).join('')}<td class="r num"><b>${tq}</b></td><td class="r num"><b>${fmt(ta)}</b></td></tr></tbody></table></div>`;
  }).join('');
}

const FIXED=['KEY','No.','娃娃圖','實體圖','月份','主題','Drop','品類','性別','款號','中文品名','英文品名','顏色','色號','色碼 SKU','Icon','布料','系列／尺寸','商品概述','商品細節','材質與科技','備註','預計上市','台灣建議售價'];

    }
  }
  if(branches){ const a={}; branches.forEach(b=>{ for(const id in b.qty) for(const z in b.qty[id]){ a[id]=a[id]||{}; a[id][z]=(a[id][z]||0)+b.qty[id][z]; } }); return {qty:a,dealer,cells,miss,bad,branches}; }
  return {qty,dealer,cells,miss,bad};
}

$('#x-export').addEventListener('click',async()=>{ const b=$('#x-export'); b.disabled=true; b.textContent='產生中…'; $('#x-msg').textContent=''; try{ const ok=await exportBook(S.qty,{...S.dealer,oid:S.editing,branches:branchesForExport()}); if(ok) $('#x-msg').textContent=totals().qty?'已含目前填的數量。':'目前沒有數量，下載的是空白訂單本。'; }catch(e){ if(e?.code!=='declined'&&e?.code!=='cancelled') $('#x-msg').textContent=e.message||'下載未完成'; } b.disabled=false; b.textContent='下載 Excel 訂單本'; });
$('#x-import').addEventListener('click',()=>$('#x-file').click());
$('#x-file').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; $('#x-msg').textContent='讀取中…';
  try{ const res=await importBook(f); $('#x-msg').textContent='';
    const n=Object.keys(res.qty).length; let q=0; for(const id in res.qty) for(const z in res.qty[id]) q+=res.qty[id][z];
    const had=totals().qty;
    const list=a=>a.length?`<ul style="margin:4px 0 0;padding-left:18px;max-height:140px;overflow:auto">${a.slice(0,40).map(x=>`<li>${esc(x)}</li>`).join('')}${a.length>40?`<li>…等 ${a.length} 筆</li>`:''}</ul>`:'';
    $('#overlay').innerHTML=`<div class="scrim"><div class="panel" style="height:auto;margin:auto;max-width:480px;border-radius:8px"><h2>匯入 Excel</h2>
      ${n?`<div class="msg ok">讀到 <b>${n}</b> 款色、<b>${fmt(q)}</b> 件${res.branches?`，分 <b>${res.branches.length}</b> 家分店（${res.branches.map(b=>esc(b.name)).join('、')}）`:''}。</div>`:`<div class="msg err">這個檔案裡沒有讀到任何數量。請確認是這個下單頁下載的訂單本，或是有「英文品名」「顏色」和尺寸欄位的訂單本。</div>`}
      ${res.miss.length?`<div class="msg err">找不到對應商品，略過：${list(res.miss)}</div>`:''}
      ${res.bad.length?`<div class="msg err">這些尺寸沒有供貨，略過：${list(res.bad)}</div>`:''}
      ${had&&n?'<p style="margin:0;color:var(--muted)">匯入會取代目前頁面上填的數量。</p>':''}
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>取消</button>${n?'<button class="btn pri" id="do-import">套用到下單頁</button>':''}</div></div></div>`;
    if(n) $('#do-import').onclick=()=>{ S.qty=res.qty; S.editing=null; S.chain=false; S.br=[]; S.bq={}; S.cur=null; if(res.branches){ S.chain=true; S.br=res.branches.map(b=>({id:brId(),name:b.name})); S.br.forEach((b,i)=>S.bq[b.id]=res.branches[i].qty); S.cur=S.br[0].id; recalcAgg(); } ['store','contact','phone','email','note'].forEach(k=>{ if(res.dealer[k]){ S.dealer[k]=res.dealer[k]; $('#d-'+k).value=res.dealer[k]; } }); saveDraft(); S.only=true; $('#only').checked=true; closeOverlay(); renderAll(); $('#x-msg').textContent='已匯入，下面只顯示有數量的商品；取消勾選「只看已下單」可看全部。'; };
  }catch(err){ $('#x-msg').textContent=err.message||'讀不到這個檔案，請確認是 .xlsx。'; }
});
function renderBranchBar(){ const bar=$('#brbar'); bar.hidden=!S.chain; $('#chain').checked=S.chain; if(!S.chain){ bar.innerHTML=''; return; }
  bar.innerHTML='<span class="lab">分店</span>'+S.br.map(b=>{ const t=brStats(b); return `<span class="br info">${esc(b.name)}<small>${t.qty} 件</small></span>`; }).join('')+'<button class="br add" data-bradd>＋新增店點</button><button class="br mng" data-brmng>管理</button>'; }
function brDialog(title,val,onOk){ $('#overlay').innerHTML=`<div class="scrim"><div class="panel" style="height:auto;margin:auto;max-width:400px;border-radius:8px"><h2>${title}</h2><div class="fld"><label for="br-name">店點名稱</label><input id="br-name" value="${esc(val||'')}" placeholder="例如：台北信義店"></div><div id="br-msg"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>取消</button><button class="btn pri" id="br-ok">確定</button></div></div></div>`; const inp=$('#br-name'); inp.focus(); inp.select();
  const go=()=>{ const v=inp.value.trim(); if(!v){ msg('#br-msg','err','請輸入店點名稱。'); return; } if(S.br.some(b=>b.name===v&&b.name!==val)){ msg('#br-msg','err','已經有同名的店點。'); return; } onOk(v); closeOverlay(); saveDraft(); renderAll(); };
  $('#br-ok').onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }); }
function openBranchMgr(){ const rows=S.br.map(b=>{ const t=brStats(b); return `<tr><td>${esc(b.name)}</td><td class="r num">${t.qty}</td><td class="r"><button class="btn sm" data-brren="${b.id}">改名</button> <button class="btn sm" data-brdel="${b.id}" ${S.br.length<2?'disabled':''}>刪除</button></td></tr>`; }).join('');
  $('#overlay').innerHTML=`<div class="scrim"><div class="panel" style="height:auto;margin:auto;max-width:480px;border-radius:8px"><div class="phead"><h2>管理店點</h2><button class="btn sm x" data-close>關閉</button></div><div class="tbl"><table><thead><tr><th>店點</th><th class="r">件數</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div id="mgr-msg"></div><p style="margin:0;color:var(--muted);font-size:12px">刪除店點會一併刪除該店填的數量。至少要保留一個店點；不需要分店時，取消勾選「連鎖分店下單」即可。</p></div></div>`; }
$('#chain').addEventListener('change',e=>{
  if(e.target.checked){ const first={id:brId(),name:(S.dealer.store||'').trim()||'店點 1'}; S.chain=true; S.br=[first]; S.bq={[first.id]:JSON.parse(JSON.stringify(S.qty))}; S.cur=first.id; recalcAgg(); saveDraft(); renderAll(); brDialog('新增第二家店點','',v=>{ const b={id:brId(),name:v}; S.br.push(b); S.cur=b.id; }); return; }
  e.target.checked=true;
  $('#overlay').innerHTML=`<div class="scrim"><div class="panel" style="height:auto;margin:auto;max-width:420px;border-radius:8px"><h2>取消分店下單？</h2><p style="margin:0">各店的數量會加總成一份單店訂單，分店名稱與各店明細會移除。</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>保留分店</button><button class="btn pri" id="chain-off">加總並取消分店</button></div></div></div>`;
  $('#chain-off').onclick=()=>{ recalcAgg(); S.chain=false; S.br=[]; S.bq={}; S.cur=null; saveDraft(); closeOverlay(); renderAll(); };
});
$('#brbar').addEventListener('click',e=>{ const b=e.target.closest('[data-br]'); if(b){ S.cur=b.dataset.br; saveDraft(); renderAll(); return; }
  if(e.target.closest('[data-bradd]')) brDialog('新增店點','',v=>{ const nb={id:brId(),name:v}; S.br.push(nb); S.cur=nb.id; });
  if(e.target.closest('[data-brmng]')) openBranchMgr(); });
$('#overlay').addEventListener('click',e=>{ const r=e.target.closest('[data-brren]'), d=e.target.closest('[data-brdel]');
  if(r){ const b=S.br.find(x=>x.id===r.dataset.brren); brDialog('店點改名',b.name,v=>{ b.name=v; }); }
  if(d&&!d.disabled){ const id=d.dataset.brdel; const b=S.br.find(x=>x.id===id); if(d.dataset.sure!=='1'){ d.dataset.sure='1'; d.textContent='確定刪除'; msg('#mgr-msg','err',`再按一次「確定刪除」會刪除「${b.name}」和它的 ${brStats(b).qty} 件數量。`); return; }
    S.br=S.br.filter(x=>x.id!==id); delete S.bq[id]; if(S.cur===id) S.cur=S.br[0].id; recalcAgg(); saveDraft(); renderAll(); openBranchMgr(); } });
function renderAll(){ renderBranchBar(); renderTabs(); renderList(); renderTally(); }
renderAll();
})();
</script>
